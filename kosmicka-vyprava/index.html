<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kosmická výprava</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Jeden tmavý svět, dva kabáty: Kadet = samolepky a razítka, Navigátor = přístrojová deska mapovny.
   Rozvržení: 3D scéna přes celé okno, vlevo lišta + mise + panel, vpravo karta tělesa, dole čas. */
:root{
  color-scheme:dark;
  --ink:#07061a; --panel:#1b1747; --panel-2:#2a2468; --line:#5148b0; --text:#f6f3ff; --muted:#bdb6ea;
  --accent:#ffd23f; --accent-ink:#2b1e00; --pop:#ff7d6e; --ok:#5ee6c5;
  --radius:20px; --bw:2.5px; --shadow:0 6px 0 rgba(0,0,0,.38);
  --font-d:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --font-b:"Nunito","Segoe UI",system-ui,sans-serif; --font-n:"Nunito","Segoe UI",system-ui,sans-serif;
  --fs:16.5px; --gap:12px; --bottom:178px;
}
body[data-mode="pro"]{
  --panel:rgba(11,15,23,.88); --panel-2:#17202e; --line:rgba(255,255,255,.15); --text:#e9edf3; --muted:#93a1b6;
  --accent:#f0b34a; --accent-ink:#1b1203; --pop:#7fd3e6; --ok:#7fe0a8;
  --radius:5px; --bw:1px; --shadow:0 10px 30px rgba(0,0,0,.45);
  --font-d:"Chakra Petch","Segoe UI",system-ui,sans-serif; --font-b:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --font-n:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --fs:14px; --bottom:92px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font:500 var(--fs)/1.45 var(--font-b);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:1.35em} h3{font-size:1.08em}
p{margin:0}
a{color:var(--pop)}
.ico{width:1.25em;height:1.25em;flex:none}
.eyebrow{font:600 .72em/1.2 var(--font-d);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block}
.lead{color:var(--muted);font-size:.93em}
.note{color:var(--muted);font-size:.82em}

#stage{position:fixed;inset:0;touch-action:none}
#c{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.lbl{position:absolute;left:0;top:0;width:0;height:0;border:0;padding:0;background:none;pointer-events:auto;white-space:nowrap;font:800 14px/1 var(--font-d);color:var(--text)}
.lbl i{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border:2px solid;border-radius:50%;opacity:0}
.lbl.dot i{opacity:.95}
.lbl span{position:absolute;left:0;top:0;padding:4px 9px 3px;border-radius:99px;background:rgba(27,23,71,.78);border:1.5px solid rgba(255,255,255,.18)}
.lbl.t-moon{font-size:12px}.lbl.t-moon span{background:rgba(27,23,71,.55)}
.lbl.on span,.lbl:hover span{background:var(--accent);color:var(--accent-ink);border-color:transparent}
body[data-mode="pro"] .lbl{font:600 11px/1 var(--font-d);letter-spacing:.16em;text-transform:uppercase}
body[data-mode="pro"] .lbl i{left:-6px;top:-6px;width:12px;height:12px;border-width:1.5px}
body[data-mode="pro"] .lbl span{background:none;border:0;padding:3px 4px;text-shadow:0 0 4px #000,0 1px 2px #000}
body[data-mode="pro"] .lbl.t-moon,body[data-mode="pro"] .lbl.t-comet{letter-spacing:.04em;text-transform:none;font-family:var(--font-b);font-weight:500;color:#c5cedb}
body[data-mode="pro"] .lbl.on span,body[data-mode="pro"] .lbl:hover span{background:none;color:var(--accent)}

/* společné plochy */
.surface{background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
body[data-mode="pro"] .surface{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.iconbtn{display:inline-grid;place-items:center;width:2.5em;height:2.5em;border-radius:calc(var(--radius)*.6 + 3px);border:var(--bw) solid var(--line);background:var(--panel-2);flex:none}
.iconbtn:hover,.iconbtn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.iconbtn.sm{width:1.7em;height:1.7em;font-weight:800;line-height:1}
.iconbtn.main{background:var(--accent);color:var(--accent-ink);border-color:transparent;width:2.9em;height:2.9em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;padding:.6em 1.1em;border-radius:calc(var(--radius)*.7 + 2px);border:0;background:var(--accent);color:var(--accent-ink);font:800 1em var(--font-d)}
body[data-mode="pro"] .btn{font-weight:600;letter-spacing:.04em}
.btn.ghost{background:var(--panel-2);color:var(--text);border:var(--bw) solid var(--line)}
.btn:hover{filter:brightness(1.1)}
.link{background:none;border:0;padding:0;color:var(--pop);text-decoration:underline;text-underline-offset:3px;font-size:.9em}
.link.danger{color:var(--muted);margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:.3em;padding:.12em .65em;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);font-size:.78em;white-space:nowrap}
.chip.ok{color:var(--ok);border-color:currentColor}.chip .ico{width:1em;height:1em}
.field{width:100%;padding:.55em .7em;border-radius:calc(var(--radius)*.5 + 3px);border:var(--bw) solid var(--line);background:var(--ink);min-width:0}
.seg{display:inline-flex;border:var(--bw) solid var(--line);border-radius:99px;overflow:hidden;background:var(--panel-2);flex:none}
body[data-mode="pro"] .seg{border-radius:var(--radius)}
.seg button{border:0;background:none;padding:.45em .95em;font:700 .9em var(--font-d);white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.thumb{display:inline-block;width:36px;height:36px;border-radius:50%;flex:none;background:#333 50% 50%/200% 100%;box-shadow:inset -6px -6px 10px rgba(0,0,0,.7),0 0 0 1.5px rgba(255,255,255,.14)}
.thumb.th-star{box-shadow:0 0 14px #ffae00}
.thumb.lg{width:66px;height:66px;box-shadow:inset -12px -12px 18px rgba(0,0,0,.7),0 0 0 2px rgba(255,255,255,.14)}
.thumb.lg.th-star{box-shadow:0 0 22px #ffae00}
.thumb.q{display:inline-grid;place-items:center;background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--line);font:800 18px var(--font-d);color:var(--muted)}

/* horní lišta */
.top{position:fixed;left:12px;right:12px;top:12px;display:flex;align-items:center;gap:var(--gap);pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.brand{font:800 1.45em/1 var(--font-d);padding:.42em .8em .36em;letter-spacing:.01em}
body[data-mode="pro"] .brand{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:1.05em;padding:.7em .9em}
.brand b{color:var(--accent);font-weight:inherit}
#rank{display:flex;align-items:center;gap:.6em;padding:.45em .9em;font-family:var(--font-d)}
#rank .xp{font-family:var(--font-n);font-size:.85em;color:var(--muted)}
#rank .bar{width:70px;height:8px;border-radius:9px;background:var(--ink);overflow:hidden}
#rank .bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.top .sp{flex:1}

/* levý sloupec */
#rail{position:fixed;left:12px;top:76px;display:flex;flex-direction:column;gap:6px;padding:6px;z-index:4}
#rail button{display:flex;flex-direction:column;align-items:center;gap:2px;width:60px;padding:8px 2px 6px;border:0;border-radius:calc(var(--radius)*.7);background:none;font:700 .68em var(--font-d);letter-spacing:.02em}
#rail .ico{width:24px;height:24px}
#rail button:hover{background:var(--panel-2)}
#rail button.on{background:var(--accent);color:var(--accent-ink)}
#leftcol{position:fixed;left:98px;top:76px;width:344px;max-height:calc(100% - 76px - var(--bottom));display:flex;flex-direction:column;gap:10px;z-index:3;pointer-events:none}
#leftcol>*{pointer-events:auto}
#mission{padding:10px 14px 12px;border-color:var(--accent)}
#mission .m-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
#mission .m-head .eyebrow{color:var(--accent);flex:1}
#mission p{font:700 1em/1.35 var(--font-b)}
#mission .hint{font-weight:500;color:var(--muted);margin-top:6px;font-size:.92em}
#mission.min p{display:none} #mission.min .link{display:none} #mission.min .m-head{margin:0}
body[data-mode="pro"] #mission p{font-weight:500}
#panel,#card{padding:14px 16px 16px;overflow:auto;overscroll-behavior:contain;contain:paint}
#panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
#panel>*{flex:none}
.p-head,.card-head{display:flex;align-items:flex-start;gap:12px}
.p-head h2{flex:1;align-self:center}
#atlas-list,#quiz,#lab{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.item{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:calc(var(--radius)*.7);border:var(--bw) solid transparent;background:var(--panel-2);text-align:center}
.item:hover{border-color:var(--accent)}
.item .nm{font:800 .9em/1.1 var(--font-d)} .item .ty{display:none}
.item .tick{position:absolute;right:6px;top:6px;color:var(--ok)} .item .tick .ico{width:16px;height:16px}
body[data-mode="pro"] .grid{grid-template-columns:1fr;gap:2px}
body[data-mode="pro"] .item{flex-direction:row;gap:10px;padding:5px 8px;background:none;text-align:left}
body[data-mode="pro"] .item:hover{background:var(--panel-2);border-color:transparent}
body[data-mode="pro"] .item .thumb{width:26px;height:26px}
body[data-mode="pro"] .item .nm{font-weight:600;flex:1}
body[data-mode="pro"] .item .ty{display:block;color:var(--muted);font-size:.82em}
body[data-mode="pro"] .item .tick{position:static}
.missions{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:m}
.missions li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:calc(var(--radius)*.6);background:var(--panel-2);border:var(--bw) solid transparent;font-size:.93em}
.missions li.act{border-color:var(--accent)}
.missions li.done .tx{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.3)}
.missions .st{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px;display:grid;place-items:center;color:var(--ink)}
.missions .done .st{background:var(--ok);border-color:var(--ok)} .missions .st .ico{width:14px;height:14px}
.missions .tx{flex:1}
.passhead{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;padding:10px 12px;border-radius:calc(var(--radius)*.6);background:var(--panel-2);border:1.5px dashed var(--line)}
.rk{display:block;font:800 1.15em var(--font-d);color:var(--accent)}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px 6px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;font:700 .72em/1.1 var(--font-d);color:var(--muted);text-align:center}
.stamp .thumb{width:52px;height:52px}
.stamp.got{color:var(--text)}
.stamp.got .thumb{transform:rotate(var(--rot));outline:2.5px dashed var(--pop);outline-offset:3px}
.answers{display:flex;flex-direction:column;gap:8px}
.ans{padding:.7em 1em;border-radius:calc(var(--radius)*.6 + 2px);border:var(--bw) solid var(--line);background:var(--panel-2);text-align:left;font-weight:700}
.ans:not(:disabled):hover{border-color:var(--accent)}
.ans.right{background:var(--ok);color:#06231b;border-color:transparent}
.ans.wrong{background:var(--pop);color:#2a0a05;border-color:transparent}
.expl{font-size:.95em}
.result{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px;border-radius:calc(var(--radius)*.7);background:var(--panel-2)}
.result b{font:800 2.2em/1 var(--font-d);color:var(--accent)}
.tool{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:calc(var(--radius)*.7);background:var(--panel-2)}
.row{display:flex;gap:8px} .row>*{flex:1;min-width:0}
.tool label{font-size:.82em;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.big b{color:var(--accent)}
.tw{overflow-x:auto}

/* karta */
#card{position:fixed;right:12px;top:76px;width:356px;max-height:calc(100% - 76px - var(--bottom));display:flex;flex-direction:column;gap:12px;z-index:3}
#card>*{flex:none}
.card-head>div{flex:1;min-width:0}
.card-head h2{font-size:1.7em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.tag{color:var(--muted);font-size:.93em}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.facts li{padding:9px 12px;border-radius:calc(var(--radius)*.6);background:var(--panel-2);border-left:5px solid var(--pop);font-weight:700}
.facts li:nth-child(2){border-color:var(--accent)} .facts li:nth-child(3){border-color:var(--ok)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles div{padding:8px 10px;border-radius:calc(var(--radius)*.5);background:var(--ink);border:1.5px solid var(--line)}
.tiles span{display:block;font-size:.76em;color:var(--muted)} .tiles b{font:800 1em/1.2 var(--font-d)}
.desc{max-width:65ch}
table.data{width:100%;border-collapse:collapse;font-size:.92em}
.data th{text-align:left;font-weight:400;color:var(--muted);padding:4px 10px 4px 0;vertical-align:top}
.data td{text-align:right;padding:4px 0;font-family:var(--font-n);font-variant-numeric:tabular-nums}
.data tr+tr th,.data tr+tr td{border-top:1px solid var(--line)}
.data.cols thead th{font:600 .78em var(--font-d);letter-spacing:.06em;text-transform:uppercase;text-align:right;padding-bottom:6px} .data.cols thead th:first-child{text-align:left}
.data.cols tbody th{color:var(--text)}
.data small{display:block;font-size:.82em;opacity:.75}
.data.now td{color:var(--accent)}
.moonrow{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:99px;border:var(--bw) solid var(--line);background:var(--panel-2);font-weight:700;font-size:.88em}
.pill .thumb{width:24px;height:24px}
.pill:hover{border-color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* dok a čas */
#dock{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);display:flex;gap:2px;padding:6px 8px;max-width:calc(100% - 24px);overflow-x:auto;z-index:2}
body[data-mode="pro"] #dock{display:none}
#dock button{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;flex:none;padding:6px 0 4px;border:0;border-radius:14px;background:none;font:800 .7em var(--font-d)}
#dock button:hover{background:var(--panel-2)} #dock button.on{background:var(--accent);color:var(--accent-ink)}
#dock .thumb{width:38px;height:38px}
#time{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 12px;max-width:calc(100% - 24px);z-index:4;white-space:nowrap}
.date{display:flex;align-items:baseline;gap:8px;background:none;border:0;padding:4px 6px;font-family:var(--font-n);font-variant-numeric:tabular-nums;min-width:11.5em;border-radius:8px}
.date:hover{background:var(--panel-2)}
.date .d{font-weight:700;font-size:1.05em} .date .t{color:var(--muted)}
.live{font:600 .7em var(--font-d);letter-spacing:.14em;text-transform:uppercase;color:var(--ok)}
.live::before{content:"";display:inline-block;width:.6em;height:.6em;border-radius:50%;background:currentColor;margin-right:.4em}
#datein{width:10.5em}
.tctl{display:flex;align-items:center;gap:6px}
.speed{min-width:7.5em;font-family:var(--font-n);font-size:.9em;color:var(--accent)}
body:not([data-mode="pro"]) .speed{min-width:10em;font-weight:800}
.tbtn{border:var(--bw) solid var(--line);background:var(--panel-2);border-radius:calc(var(--radius)*.6 + 3px);padding:.45em .8em;font:700 .88em var(--font-d)}
.tbtn:hover,.tbtn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.layers{position:relative}
.pop{position:absolute;right:0;bottom:calc(100% + 14px);display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pop label{display:flex;align-items:center;gap:8px;cursor:pointer}
.pop input{width:1.1em;height:1.1em;accent-color:var(--accent)}

/* hlášky, modál, načítání */
#toasts{position:fixed;left:50%;top:74px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:9;pointer-events:none;width:min(440px,calc(100% - 32px))}
.toast{padding:.6em 1.1em;border-radius:99px;background:var(--text);color:#15122e;font-weight:700;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
body[data-mode="pro"] .toast{border-radius:var(--radius);font-weight:500}
.toast.t-stamp{background:var(--pop);color:#2a0a05} .toast.t-mission{background:var(--ok);color:#06231b} .toast.t-rank{background:var(--accent);color:var(--accent-ink)}
.toast em{font-style:normal;font-family:var(--font-n);opacity:.8;margin-left:.3em}
.toast.out{opacity:0;transition:opacity .5s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#modal{position:fixed;inset:0;background:rgba(4,3,14,.62);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.sheet{width:min(600px,100%);max-height:100%;overflow:auto;padding:22px 24px;background:var(--panel);border:var(--bw) solid var(--line);border-radius:calc(var(--radius) + 4px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.welcome h1{font-size:2.5em;color:var(--accent)}
.welcome .q{font:800 1.1em var(--font-d);margin-top:4px}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choose button{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border-radius:18px;border:2.5px solid var(--line);background:var(--panel-2)}
.choose button:hover{border-color:var(--accent)}
.choose b{font:800 1.4em var(--font-d);color:var(--accent)} .choose span{font-size:.9em;color:var(--muted)}
.choose button:last-child{border-radius:5px;border-width:1px;background:#0e131c}
.choose button:last-child b{font:600 1.15em "Chakra Petch",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#f0b34a}
.plain{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:.94em}
.credits{list-style:none;padding:0;font-size:.86em;color:var(--muted)} .credits b{color:var(--text)} .credits a{word-break:break-all}
#loader{position:fixed;inset:0;background:var(--ink);display:grid;place-content:center;justify-items:center;gap:14px;z-index:30;transition:opacity .6s}
#loader.gone{opacity:0;pointer-events:none}
#loader b{font:800 1.9em var(--font-d);color:var(--accent)}
#loader .track{width:220px;height:10px;border-radius:9px;background:var(--panel-2);overflow:hidden}
#loadbar{height:100%;width:4%;background:var(--accent);border-radius:9px;transition:width .2s}

/* porovnání */
body.cmp .top,body.cmp #rail,body.cmp #leftcol,body.cmp #card,body.cmp #dock,body.cmp #time,body.cmp #labels{display:none}
#cmpbar{position:fixed;inset:0;pointer-events:none;z-index:6}
#cmpbar>*{pointer-events:auto;position:absolute}
.cmp-top{left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:center}
.cmp-top .eyebrow{font-size:.95em;color:var(--text)}
.cmp-caps{left:0;right:0;bottom:150px;display:grid;grid-template-columns:1fr 1fr;text-align:center;pointer-events:none!important}
.cap h2{font-size:1.7em} .cap span{color:var(--muted);font-family:var(--font-n);font-size:.9em}
.cmp-ctl{left:50%;bottom:88px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;width:min(520px,calc(100% - 32px))}
.cmp-fact{left:50%;bottom:22px;transform:translateX(-50%);width:min(720px,calc(100% - 32px));text-align:center;font-weight:700;text-wrap:balance}
#cmp-mark{display:none;width:30px;height:30px;margin:-15px 0 0 -15px;border:2px solid var(--accent);border-radius:50%;pointer-events:none!important}

@media (max-width:1100px){
  #time .tbtn[data-act="reverse"]{display:none}
  #leftcol{width:316px} #card{width:320px}
}
@media (max-width:820px){
  :root{--bottom:150px}
  .brand{display:none}
  .top{left:8px;right:8px;top:8px;gap:8px}
  #rank .bar{display:none}
  #rail{left:0;right:0;top:auto;bottom:0;flex-direction:row;justify-content:space-around;border-radius:0;border-width:var(--bw) 0 0;padding:4px;box-shadow:none}
  #rail button{width:auto;flex:1;padding:5px 2px 3px}
  #leftcol{display:contents}
  #mission{position:fixed;left:8px;right:8px;top:60px;z-index:3;padding:8px 12px}
  #panel{position:fixed;left:8px;right:8px;bottom:128px;top:auto;max-height:58%;z-index:6}
  #card{left:8px;right:8px;width:auto;top:auto;bottom:128px;max-height:44%;z-index:5}
  #dock{display:none}
  #time{left:8px;right:8px;bottom:64px;transform:none;max-width:none;gap:6px;padding:6px 8px;overflow-x:auto;justify-content:flex-start}
  #time .speed,#time .tbtn[data-act="now"],#time .date .t{display:none}
  #time>*{flex:none}
  .date{min-width:0}
  .seg button{padding:.4em .7em}
  #toasts{top:120px}
  .choose{grid-template-columns:1fr}
  .cmp-caps{bottom:170px} .cap h2{font-size:1.2em}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}#loader{transition:none}}
</style>
</head>
<body data-mode="kid">
<div id="stage"><canvas id="c" aria-label="Trojrozměrný model Sluneční soustavy"></canvas><div id="labels"></div></div>

  <div id="rank" class="surface"></div>
  <span class="sp"></span>
  <div id="modeseg" class="seg" role="group" aria-label="Režim"></div>

  <button class="iconbtn" data-act="about" aria-label="O aplikaci a ovládání"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 11v6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.3"/></svg></button>
</header>

<nav id="rail" class="surface" aria-label="Hlavní nabídka"></nav>
<div id="leftcol">

  <aside id="panel" class="surface" hidden></aside>
</div>
<aside id="card" class="surface" hidden></aside>
<div id="dock" class="surface" aria-label="Rychlá cesta k tělesům"></div>
<div id="time" class="surface"></div>
<div id="cmpbar" hidden></div>
<div id="toasts" aria-live="polite"></div>

<div id="loader"><b>Kosmická výprava</b><div class="track"><div id="loadbar"></div></div><span class="lead">Startujeme…</span></div>
